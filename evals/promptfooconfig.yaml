description: Vocabuilder production-path multilingual translation evaluations

env:
  # Shared by the production-path provider and Promptfoo's Google judge. Both
  # append the native Gemini /v1beta/models/{model}:generateContent route.
  GOOGLE_API_BASE_URL: http://127.0.0.1:8317
  PROMPTFOO_PASS_RATE_THRESHOLD: 75
  PROMPTFOO_REQUEST_BACKOFF_MS: 10000

# Each row makes one production translation call, one deterministic contract
# assertion, and one semantic judge call through CLIProxyAPI. The Pro judge is
# intentionally distinct from the default Flash translation model.
commandLineOptions:
  maxConcurrency: 4
  share: false

prompts:
  - "{{input}}"

providers:
  - id: file://promptfoo/provider.ts
    label: vocabuilder-production
    config:
      model: gemini-3.5-flash-extra-low
      temperature: 0

defaultTest:
  options:
    transformVars: file://promptfoo/transform-vars.cjs
    rubricPrompt: file://promptfoo/judge-prompt.txt
  assert:
    - type: javascript
      metric: application_contract
      value: file://promptfoo/assert-output.cjs
    - type: llm-rubric
      metric: translation_quality
      provider:
        id: google:gemini-3.1-pro-low
        config:
          apiVersion: v1beta
          temperature: 0
          maxOutputTokens: 2048
          retries: 3
          timeout: 60000
      value: |
        Evaluate the Vocabuilder result for this exact case.

        Source item: {{input}}
        Source language: {{sourceLanguageName}}
        Target language: {{targetLanguageName}}
        Intended meaning and coverage: {{intent}}
        Deterministic expectations JSON: {{expectJson}}

        Candidate field semantics: "exampleTranslation" is the source-language
        sentence, while "example" is its target-language translation. These names
        reflect the app's stored schema; do not infer the opposite orientation from
        the field names.

        The separate application_contract assertion checks JSON structure, exact
        error/correction fields, duplicate senses, forbidden forms, and whether each
        source-language example contains the evaluated source form. Do not re-grade
        those mechanical checks here.

        For an expected error result, pass when the candidate reports that error;
        do not require translation senses.

        For a successful result, pass only when every applicable criterion holds:
        1. Accuracy and sense selection: each returned gloss expresses a real,
           learner-useful sense of the source item. The important sense or distinction
           named in Intended meaning and coverage is present. Do not require obscure
           dictionary senses or exact reference wording.
        2. No misleading additions: extra senses are allowed only when common and
           genuinely relevant. False friends, literal renderings of idioms, invented
           meanings, and conflated senses fail.
        3. Target-language quality: glosses and target examples use standard,
           natural target-language grammar, spelling, morphology, register, and
           vocabulary. Fail drift into a related language or an unnatural calque.
        4. Example fidelity: every "exampleTranslation" source sentence is
           grammatical and demonstrates its listed source sense; its "example"
           target sentence is a natural translation of that same sentence and
           demonstrates the listed target gloss.
        5. Learner usefulness: part-of-speech choices and ordering do not mislead a
           learner. Minor stylistic variation, regional variants, and natural
           synonyms are acceptable.

        Return pass=true and score=1 only if all applicable criteria pass. Otherwise
        return pass=false and score=0, naming the decisive error in the reason.

tests: file://promptfoo/cases.cjs
