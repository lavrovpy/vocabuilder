name: Prompt Eval

# Manual runs only. To run on every change again, restore the pull_request and
# push triggers from git history.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Translate Prompt Eval (${{ matrix.provider }})
    runs-on: ubuntu-latest
    env:
      EVAL_JUDGE: anthropic/claude-sonnet-5-5

    strategy:
      fail-fast: false
      matrix:
        include:
          # The anthropic leg is required: ANTHROPIC_API_KEY also runs the judge for every leg.
          - provider: anthropic
            secret: ANTHROPIC_API_KEY
            optional: false
          - provider: gemini
            secret: GEMINI_API_KEY
            optional: true
          - provider: openai
            secret: OPENAI_API_KEY
            optional: true

    steps:
      - name: Check provider key
        id: key
        env:
          PROVIDER_KEY: ${{ secrets[matrix.secret] }}
        run: |
          if [ -n "$PROVIDER_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.optional }}" = "true" ]; then
            echo "::warning title=Eval skipped::${{ matrix.secret }} is not set, so the ${{ matrix.provider }} eval did not run. Add it as a repository Actions secret to enable this leg."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Missing secret::${{ matrix.secret }} is not set. Add it as a repository Actions secret to run the ${{ matrix.provider }} eval."
            exit 1
          fi

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: npm ci

      # Env keys cannot be expressions, so the leg's key is exported under its name in the script.
      - name: Run prompt eval
        id: eval
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROVIDER_KEY: ${{ secrets[matrix.secret] }}
        run: |
          export "${{ matrix.secret }}=$PROVIDER_KEY"
          npm run eval -- --model "${{ matrix.provider }}" --judge "$EVAL_JUDGE"

      - name: Publish eval summary
        if: always() && steps.eval.outcome != 'skipped'
        run: |
          for report in evals/results/runs/*/compare-*.md evals/results/runs/*/summary.md; do
            [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
          true

      - name: Upload eval artifact
        if: always() && steps.eval.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: prompt-eval-results-${{ matrix.provider }}
          path: evals/results/
          if-no-files-found: warn
          retention-days: 30
